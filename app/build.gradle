plugins { id 'com.android.application' }

android {
    namespace 'com.naveenans.olabatteryalert'
    compileSdk 35

    defaultConfig {
        applicationId 'com.naveenans.olabatteryalert'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
}

dependencies {
    // Unbundled Play Services OCR keeps the APK small; the text model is supplied by Google Play services.
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
}
